# rcj-hub · Cloudflare Pages + D1 绑定配置（参考）
# 本机无 Cloudflare 凭证，无法 wrangler 部署；此文件供你在本地或 CI 使用。
# 更简单的方式：直接在 CF 后台 Pages 项目 → Settings → Functions → D1 bindings 里加绑定（见交付说明）。

name = "rcj-hub"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"                       # Functions 里用 env.DB 访问
database_name = "rcj-hub-d1"        # D1 数据库名（与 CF 后台一致）
database_id = "b18ad841-ee76-4454-97f6-4515f32bb5bf"
