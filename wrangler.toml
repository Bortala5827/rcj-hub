# rcj-lab · Cloudflare Pages + D1 绑定配置（参考）
# 本机无 Cloudflare 凭证，无法 wrangler 部署；此文件供你在本地或 CI 使用。
# 更简单的方式：直接在 CF 后台 Pages 项目 → Settings → Functions → D1 bindings 里加绑定（见交付说明）。

name = "rcj-lab"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# Sing to Me 语音存储（用户录音）· 用户开通的 R2
[[r2_buckets]]
binding = "SING_R2"
bucket_name = "rcj-sing"

# 注意：rcj-lab 的 Functions 不通过 env.DB 绑定访问 D1，
# 而是用硬编码的 D1 UUID + CF_API_TOKEN/CF_ACCOUNT_ID 经 CF API 直查
# （见 functions/api/admin/data.js 的 DBS 对象、functions/api/track.js 的 ANALYTICS_DB）。
# 故此处不再声明任何 D1 binding；曾声明的 DB→rcj-lab-d1(b18ad841) 因该库已删
# 会导致 Pages 部署失败（"D1 binding 'DB' references database ... not found"），
# 已于 2026-08-17 移除。如需新增绑定，请改用真实存在的库 UUID。
