name: Cleanup Cloudflare Pages Deployments

# 自动清理 Cloudflare Pages 旧部署：每项目保留最新 3 个（不限状态），其余删除。
# 触发：每日 02:00 UTC + 手动(workflow_dispatch)。
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run cleanup (keep latest 3 per project)
        env:
          TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACCT: ${{ secrets.CF_ACCOUNT_ID }}
          KEEP: '3'
        run: node .github/scripts/cleanup-pages.mjs
