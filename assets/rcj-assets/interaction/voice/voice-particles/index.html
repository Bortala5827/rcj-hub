<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RCJ · voice/voice-particles demo</title>
<link rel="stylesheet" href="./voice-particles.css" />
<style>
  body { margin:0; font-family:system-ui,-apple-system,"PingFang SC",sans-serif; background:#fafafa; padding:32px 16px; color:#1f2937; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#6b7280; font-size:13px; margin:0 0 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎤 voice/voice-particles</h1>
  <p class="sub">RCJ Voice Engine · 声纹驱动表情跳动（麦克风暖场）</p>

  <section class="vwarm">
    <p class="vwarm-eyebrow">暖场 · 面试前松一松</p>
    <div class="vwarm-head">
      <span class="vwarm-emoji">🪀</span>
      <h2 class="vwarm-title">先松松手 · 对着声纹吐个槽</h2>
    </div>
    <p class="vwarm-sub" id="vwarm-sub">对着麦克风随便说几句 —— 看表情跟着声纹蹦，把紧张先抖出去。</p>
    <div class="vwarm-stage" id="vwarm-stage">
      <span class="vw-face" data-face>😀</span>
      <span class="vw-face" data-face>😮</span>
      <span class="vw-face" data-face>😎</span>
      <span class="vw-face" data-face>🤩</span>
      <span class="vw-face" data-face>😺</span>
    </div>
    <button class="vwarm-btn" id="vwarm-btn" type="button">🎤 开始声纹热身</button>
  </section>
</div>

<script type="module">
  import { mountVoiceParticles } from './voice-particles.js';
  mountVoiceParticles({ stageId: 'vwarm-stage', btnId: 'vwarm-btn', subId: 'vwarm-sub' });
</script>
</body>
</html>
