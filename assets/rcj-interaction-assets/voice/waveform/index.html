<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RCJ · voice/waveform demo</title>
<style>
  :root { --accent:#6f9b8a; --ink:#1f2937; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"PingFang SC",sans-serif; color:var(--ink); background:#fafafa; padding:32px 16px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#6b7280; font-size:13px; margin:0 0 20px; }
  .stage { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; }
  canvas { width:100%; height:120px; display:block; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  button { border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 16px; border-radius:999px; font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  .hint { color:#9ca3af; font-size:12px; margin-top:10px; min-height:1em; }
  label { font-size:13px; color:#374151; display:inline-flex; align-items:center; gap:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎤 voice/waveform</h1>
  <p class="sub">RCJ Voice Engine · 实时声纹波形 / 频谱 / 波形线（无外部依赖，纯 Canvas + Web Audio）</p>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="row">
      <button class="primary" id="mic">🎤 开麦克风</button>
      <label><input type="checkbox" id="mirror" /> 镜像反射</label>
      <label><input type="checkbox" id="pulse" /> 呼吸律动</label>
      <label><input type="checkbox" id="wobble" /> 颤抖抖动</label>
    </div>
    <p class="hint" id="hint">点「开麦克风」授权后，对着说话即可看到声纹波动。</p>
  </div>
</div>

<script type="module">
  import { mountLiveBars, mountLiveWave, fitCanvas } from './waveform.js';

  const cv = document.getElementById('cv');
  fitCanvas(cv, 120);
  const hint = document.getElementById('hint');
  let stop = null, mode = 'bars';

  async function start() {
    if (!navigator.mediaDevices?.getUserMedia) { hint.textContent = '当前浏览器不支持麦克风采集。'; return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      src.connect(analyser);

      const opts = {
        gradient: ['#6f9b8a', '#7c3aed'],
        mirror: document.getElementById('mirror').checked,
        pulse: document.getElementById('pulse').checked ? 0.5 : 0,
        wobble: document.getElementById('wobble').checked ? 0.5 : 0,
        bars: 72,
      };
      stop?.();
      stop = mountLiveBars(cv, analyser, opts);
      hint.textContent = '正在采集 —— 说话 / 哼歌都行。';
    } catch (e) {
      hint.textContent = '麦克风权限被拒，点按钮再授权一次 🎤';
    }
  }

  document.getElementById('mic').addEventListener('click', () => {
    if (stop) { stop(); stop = null; hint.textContent = '已停止。'; }
    else start();
  });
  ['mirror','pulse','wobble'].forEach(id =>
    document.getElementById(id).addEventListener('change', () => { if (stop) start(); }));
</script>
</body>
</html>
