<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>此刻通勤 · 天涯共此时 · RCJ Lab</title>
  <meta name="description" content="此刻，有多少人和我一起在通勤？一个轻量的天涯共此时实验。" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/assets/hub.v2.css?v=20260822a" />
  <link rel="stylesheet" href="./commute.css?v=20260822d" />
</head>
<body class="hub moment">
  <header class="site-header">
    <div class="container nav">
      <a class="wordmark" href="/" aria-label="返回 RCJ Lab 首页">
        <span class="mark">R</span>
        <span class="wm-text">RCJ Lab</span>
      </a>
      <button class="nav-hamburger" aria-label="菜单" aria-expanded="false" id="navBurger">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-menu" aria-label="站点导航" id="navMenu">
        <a href="/" aria-current="page">此刻通勤</a>
      </nav>
    </div>
  </header>

  <main class="container moment-main">
    <section class="moment-hero reveal" aria-labelledby="mTitle">
      <p class="eyebrow">PLAYGROUND · 天涯共此时</p>
      <h1 id="mTitle" class="m-title">此刻，谁和我一起在通勤？</h1>
      <p class="m-sub">天涯共此时。</p>
    </section>

    <section class="moment-card reveal" aria-live="polite">
      <div class="m-stat">
        <div class="m-stat-label">此刻正在通勤</div>
        <div class="m-stat-num" id="mNum">—</div>
        <div class="m-stat-foot">最近 2 小时内未结束的记录</div>
      </div>

      <!-- 统计：极简，只放数字 -->
      <div class="m-stats" id="mStats">
        <div class="m-stat-cell">
          <div class="m-stat-cell-num" id="mStatDone">0</div>
          <div class="m-stat-cell-label">今日完成</div>
        </div>
        <div class="m-stat-cell">
          <div class="m-stat-cell-num" id="mStatMin">—</div>
          <div class="m-stat-cell-label">最短</div>
        </div>
        <div class="m-stat-cell">
          <div class="m-stat-cell-num" id="mStatMax">—</div>
          <div class="m-stat-cell-label">最长</div>
        </div>
        <div class="m-stat-cell">
          <div class="m-stat-cell-num" id="mStatAvg">—</div>
          <div class="m-stat-cell-label">平均</div>
        </div>
      </div>

      <!-- 状态 A：未在通勤 -->
      <div class="m-action" id="mActionIdle">
        <div class="m-fields">
          <div class="m-field">
            <div class="m-field-label">通勤方式（可选）</div>
            <div class="m-chips" id="mModeChips" role="radiogroup" aria-label="通勤方式">
              <button type="button" class="m-chip" data-mode="地铁" aria-pressed="false"><span class="m-dot m-dot-subway"></span>地铁</button>
              <button type="button" class="m-chip" data-mode="公交" aria-pressed="false"><span class="m-dot m-dot-bus"></span>公交</button>
              <button type="button" class="m-chip" data-mode="自驾" aria-pressed="false"><span class="m-dot m-dot-car"></span>自驾</button>
              <button type="button" class="m-chip" data-mode="小电驴" aria-pressed="false"><span class="m-dot m-dot-ebike"></span>小电驴</button>
              <button type="button" class="m-chip" data-mode="步行" aria-pressed="false"><span class="m-dot m-dot-walk"></span>步行</button>
            </div>
          </div>
          <div class="m-field">
            <div class="m-field-label">今日路况（可选）</div>
            <div class="m-chips" id="mTrafficChips" role="radiogroup" aria-label="路况">
              <button type="button" class="m-chip" data-traffic="畅通" aria-pressed="false">🛣️ 一路畅通</button>
              <button type="button" class="m-chip" data-traffic="走走停停" aria-pressed="false">🚦 走走停停</button>
              <button type="button" class="m-chip" data-traffic="寸步难行" aria-pressed="false">🚧 寸步难行</button>
            </div>
          </div>
        </div>
        <button class="m-btn m-btn-primary" id="mBtnStart" type="button">
          <span class="m-btn-label">我出发了</span>
        </button>
      </div>

      <!-- 状态 B：在通勤中 -->
      <div class="m-action m-action-on" id="mActionOn" hidden>
        <div class="m-on-meta" id="mOnMeta">通勤中</div>
        <div class="m-timer" id="mTimer" aria-live="off">00:00</div>
        <button class="m-btn m-btn-success" id="mBtnArrive" type="button">
          <span class="m-btn-label">我到了</span>
        </button>
        <button class="m-btn-text" id="mBtnCancel" type="button">点错了（撤销）</button>
      </div>

      <p class="m-hint" id="mHint">未结束的记录将在 2 小时后自动结束。</p>
    </section>

    <p class="m-foot reveal">
      <a href="/">RCJ Lab</a>
    </p>
  </main>

  <script src="./commute.js?v=20260822d" defer></script>
</body>
</html>
