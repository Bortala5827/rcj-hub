<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分享的 HTML · RCJ9527</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e88e5'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='system-ui' font-size='28' font-weight='800' fill='white'%3ER%3C/text%3E%3C/svg%3E" />
  <style>
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
    .bar{position:fixed;top:0;left:0;right:0;height:46px;background:rgba(15,23,42,.92);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:20;font-size:13px;backdrop-filter:blur(6px);}
    .bar .logo{width:28px;height:28px;border-radius:7px;background:#1e88e5;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
    .bar a{color:#cfe3f5;text-decoration:none;margin-left:auto;border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:8px;font-weight:600;}
    .bar a:hover{background:rgba(255,255,255,.12);}
    .frame-wrap{position:fixed;top:46px;left:0;right:0;bottom:0;background:#fff;}
    iframe{width:100%;height:100%;border:none;}
    .msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#64748b;text-align:center;padding:24px;gap:10px;}
    .msg .big{font-size:42px;}
    .msg a{color:#1e88e5;font-weight:700;}
    .loader{color:#1e88e5;}
  </style>
</head>
<body>
  <div class="bar">
    <div class="logo">R</div>
    <span>分享的 HTML 预览</span>
    <a href="index.html">＋ 制作新链接</a>
  </div>

  <div class="frame-wrap" id="wrap">
    <div class="msg" id="msg"><div class="big loader">⏳</div><div>正在解码分享内容…</div></div>
  </div>

  <script src="lz-string.min.js"></script>
  <script>
  (function(){
    "use strict";
    function decode(enc){
      if (!enc) return null;
      try {
        if (enc[0] === "L"){
          if (window.LZString && window.LZString.decompressFromEncodedURIComponent)
            return window.LZString.decompressFromEncodedURIComponent(enc.slice(1));
        } else if (enc[0] === "B"){
          return decodeURIComponent(escape(atob(enc.slice(1))));
        }
      } catch(e){ return null; }
      // 兜底：尝试当作 LZString（兼容老格式）
      try { if (window.LZString) return window.LZString.decompressFromEncodedURIComponent(enc); } catch(e){}
      return null;
    }

    function showError(){
      document.getElementById("msg").innerHTML =
        '<div class="big">🔗</div>' +
        '<div>链接无效或已损坏，无法解码。</div>' +
        '<div><a href="index.html">回到制作页重新生成 →</a></div>';
    }

    var hash = location.hash || "";
    var m = hash.match(/[#&]v=([^&]+)/);
    if (!m){ showError(); return; }
    var html = decode(m[1]);
    if (html == null){ showError(); return; }

    var wrap = document.getElementById("wrap");
    wrap.innerHTML = "";
    var ifr = document.createElement("iframe");
    // 沙箱运行：允许脚本/弹窗/表单，但不给 same-origin，避免访问父页面
    ifr.setAttribute("sandbox", "allow-scripts allow-popups allow-modals allow-forms allow-pointer-lock");
    ifr.setAttribute("srcdoc", html);
    wrap.appendChild(ifr);
  })();
  </script>
</body>
</html>
