  <style>
    .post-wrap { max-width: 720px; margin: 0 auto; padding: 40px 0 60px; }
    .post-back { font-size: 13px; color: var(--ink-3); margin-bottom: 28px; }
    .post-back a { color: var(--ink-3); }
    .post-back a:hover { color: var(--accent); }
    .post-head { margin-bottom: 30px; }
    .post-head h1 { font-size: clamp(24px, 3.2vw, 32px); font-weight: 700; letter-spacing: -0.02em; color: var(--ink); line-height: 1.35; margin-bottom: 12px; }
    .post-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .post-head .post-date { font-size: 13px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
    .post-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .ptag { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 6px; background: var(--accent-weak); color: var(--accent); }

    /* 正文排版（markdown 渲染结果） */
    .post-body { font-size: 16px; line-height: 1.85; color: var(--ink); }
    .post-body p { margin: 0 0 18px; }
    .post-body h2, .post-body h3, .post-body h4, .post-body h5, .post-body h6 { margin: 30px 0 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); line-height: 1.4; }
    .post-body h2 { font-size: 21px; }
    .post-body h3 { font-size: 18px; }
    .post-body h4 { font-size: 16px; }
    .post-body h5, .post-body h6 { font-size: 15px; }
    .post-body ul, .post-body ol { margin: 0 0 18px; padding-left: 24px; }
    .post-body li { margin-bottom: 6px; }
    .post-body ul { list-style: disc; }
    .post-body ol { list-style: decimal; }
    .post-body blockquote { margin: 0 0 18px; padding: 2px 0 2px 18px; border-left: 3px solid var(--accent); color: var(--ink-2); }
    .post-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; background: var(--bg-soft); padding: 1px 6px; border-radius: 5px; color: #c2410c; }
    .post-body pre { margin: 0 0 18px; padding: 16px 18px; background: #0f172a; color: #e2e8f0; border-radius: 10px; overflow-x: auto; line-height: 1.6; }
    .post-body pre code { background: none; padding: 0; color: inherit; font-size: 13px; }
    .post-body hr { border: none; border-top: 1px solid var(--line); margin: 30px 0; }
    .post-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .post-body img { max-width: 100%; border-radius: 10px; margin: 8px 0; }
    .post-body strong { font-weight: 700; }
    .post-body em { font-style: italic; }
  </style>
</head>
<body class="hub">
  <header class="site-header">
    <div class="container nav">
      <a class="wordmark" href="/">
        <span class="mark">R</span>
        <span class="wm-text">RCJ Lab</span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="/#lab">作品</a>
        <a href="/archive">档案</a>
        <a href="/principles">原则</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="post-wrap" id="postWrap">
      <div class="blog-empty">读取中…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-row">
        <a class="footer-email" href="mailto:Bortala5827@gmail.com">✉ Bortala5827@gmail.com</a>
        <span class="footer-sep">·</span>
        <span class="footer-copy">© 2026 RCJ9527</span>
        <span class="footer-sep">·</span>
        <span class="footer-powered">Powered by Cloudflare Pages</span>
      </div>
    </div>
  </footer>

  <script>
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    // ---------- 极简 markdown 渲染（零依赖，覆盖手记常用语法） ----------
    function inline(t) {
      return t
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" />')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function md2html(src) {
      // 转义 & 和 <（> 保留，供引用块标记判断；孤立 > 无注入风险）
      let s = src.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      // 提取代码块，占位保护
      const blocks = [];
      s = s.replace(/```([\s\S]*?)```/g, (m, code) => {
        blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
        return '\u0000CB' + (blocks.length - 1) + '\u0000';
      });

      const lines = s.split('\n');
      const out = [];
      let inList = false, listType = null, para = [];

      const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
      const closeList = () => { if (inList) { out.push('</' + listType + '>'); inList = false; listType = null; } };

      for (const raw of lines) {
        const line = raw.trim();
        // 代码块占位
        if (/^\u0000CB\d+\u0000$/.test(line)) { closeList(); flushPara(); out.push(blocks[+line.match(/\d+/)[0]]); continue; }
        // 分割线
        if (/^(-{3,}|\*{3,})$/.test(line)) { closeList(); flushPara(); out.push('<hr />'); continue; }
        // 标题
        let m = line.match(/^(#{1,6})\s+(.*)$/);
        if (m) { closeList(); flushPara(); const l = m[1].length; out.push('<h' + l + '>' + inline(m[2]) + '</h' + l + '>'); continue; }
        // 引用
        if (line.startsWith('>')) { closeList(); flushPara(); out.push('<blockquote>' + inline(line.replace(/^>\s?/, '')) + '</blockquote>'); continue; }
        // 无序列表
        m = line.match(/^[-*]\s+(.*)$/);
        if (m) { flushPara(); if (!inList || listType !== 'ul') { closeList(); out.push('<ul>'); inList = true; listType = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); continue; }
        // 有序列表
        m = line.match(/^\d+\.\s+(.*)$/);
        if (m) { flushPara(); if (!inList || listType !== 'ol') { closeList(); out.push('<ol>'); inList = true; listType = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); continue; }
        // 空行
        if (!line) { closeList(); flushPara(); continue; }
        // 段落
        if (inList) closeList();
        para.push(line);
      }
      closeList(); flushPara();
      return out.join('\n');
    }

    function parseFront(md) {
      const m = md.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
      if (!m) return { meta: {}, body: md };
      const meta = {};
      m[1].split('\n').forEach((line) => {
        const i = line.indexOf(':');
        if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      });
      // tags 支持逗号分隔（frontmatter 里写 tags: 随笔, 产品 或 tags: ["随笔","产品"]）
      if (meta.tags) {
        meta.tags = meta.tags.replace(/[\[\]"']/g, '').split(',').map((t) => t.trim()).filter(Boolean);
      } else {
        meta.tags = [];
      }
      return { meta, body: m[2] };
    }

    (async function () {
      const wrap = document.getElementById('postWrap');
      const slug = new URLSearchParams(location.search).get('slug') || '';
      if (!slug) {
        wrap.innerHTML = '<div class="blog-empty">缺少文章标识。<br><br><a class="post-back" href="/blog/">返回手记列表</a></div>';
        return;
      }
      try {
        const res = await fetch('posts/' + encodeURIComponent(slug) + '.md', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        const { meta, body } = parseFront(md);
        document.title = (meta.title ? meta.title + ' · ' : '') + '创始人手记 · RCJ Lab';
        const tagsHtml = (meta.tags && meta.tags.length)
          ? '<div class="post-tags">' + meta.tags.map((t) => '<span class="ptag">' + esc(t) + '</span>').join('') + '</div>'
          : '';
        const html =
          '<div class="post-back"><a href="/blog/">← 创始人手记</a></div>'
          + '<div class="post-head">'
          + '<h1>' + esc(meta.title || slug) + '</h1>'
          + '<div class="post-meta">'
          + (meta.date ? '<span class="post-date">上传于 ' + esc(meta.date) + '</span>' : '')
          + tagsHtml
          + '</div>'
          + '</div>'
          + '<div class="post-body">' + md2html(body) + '</div>'
          // 公众号引流位：暂不启用，以后要加在这里（文字引导 / 二维码图片）
          + '<div class="post-back" style="margin-top:40px"><a href="/blog/">← 创始人手记</a></div>';
        wrap.innerHTML = html;
      } catch (e) {
        wrap.innerHTML = '<div class="blog-empty">加载失败：' + esc(e.message) + '<br><br><a class="post-back" href="/blog/">返回手记列表</a></div>';
      }
    })();
  </script>
</body>
</html>
