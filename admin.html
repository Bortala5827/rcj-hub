<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>友链审核 · RCJ Hub</title>
  <style>
    :root {
      --bg: #f8fafc; --surface: #fff; --text: #0f172a; --muted: #64748b;
      --accent: #1e88e5; --danger: #dc2626; --line: #e2e8f0; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

    /* Login */
    .login-box {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 28px; max-width: 400px; margin: 60px auto;
    }
    .login-box label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .login-box input {
      width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid var(--line);
      border-radius: 8px; outline: none; transition: border-color .2s;
    }
    .login-box input:focus { border-color: var(--accent); }
    .login-box button {
      width: 100%; margin-top: 16px; padding: 11px; font-size: 15px; font-weight: 600;
      background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer;
      transition: background .2s;
    }
    .login-box button:hover { background: #1565c0; }

    /* List */
    .list { display: flex; flex-direction: column; gap: 12px; }
    .item {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 20px; display: flex; align-items: flex-start; gap: 16px;
      transition: box-shadow .15s;
    }
    .item:hover { box-shadow: 0 2px 8px rgba(15,23,42,.06); }
    .item.pending { border-left: 4px solid #f59e0b; }
    .item.approved { border-left: 4px solid #16a34a; }
    .item-body { flex: 1; min-width: 0; }
    .item-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .item-url { font-size: 13px; color: var(--accent); word-break: break-all; margin-bottom: 4px; }
    .item-desc { font-size: 13px; color: var(--muted); }
    .item-time { font-size: 12px; color: #94a3b8; margin-top: 6px; }
    .item-actions { display: flex; gap: 8px; flex-shrink: 0; padding-top: 2px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 6px; margin-left: 6px; vertical-align: middle;
    }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-approved { background: #dcfce7; color: #166534; }
    .btn {
      padding: 7px 16px; font-size: 13px; font-weight: 600; border: none; border-radius: 8px;
      cursor: pointer; transition: background .15s;
    }
    .btn-approve { background: #dcfce7; color: #166534; }
    .btn-approve:hover { background: #bbf7d0; }
    .btn-delete { background: #fee2e2; color: #991b1b; }
    .btn-delete:hover { background: #fecaca; }
    .btn-revoke { background: #e0e7ff; color: #3730a3; }
    .btn-revoke:hover { background: #c7d2fe; }
    .btn:disabled { opacity: .5; cursor: default; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state p { font-size: 15px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .btn-logout { font-size: 13px; color: var(--muted); cursor: pointer; background: none; border: none; }
    .btn-logout:hover { color: var(--danger); }
    .error { background: #fef2f2; color: #991b1b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid var(--line); }
    .tab {
      padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      border: none; background: none; color: var(--muted); border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-count {
      display: inline-block; min-width: 20px; text-align: center; font-size: 11px;
      background: var(--line); color: var(--muted); padding: 1px 6px; border-radius: 10px; margin-left: 4px;
    }
    .tab.active .tab-count { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
(function(){
  var el = document.getElementById('app');
  var pw = localStorage.getItem('admin_pw') || '';
  var allLinks = [];
  var currentTab = 'pending';

  function renderLogin(err) {
    el.innerHTML = '<div class="login-box">' +
      '<h1>🔐 友链审核</h1>' +
      '<p class="sub">输入管理员密码</p>' +
      (err ? '<div class="error">' + esc(err) + '</div>' : '') +
      '<label>密码</label>' +
      '<input type="password" id="pw-input" placeholder="输入密码…" autofocus />' +
      '<button onclick="login()">登录</button>' +
      '</div>';
    document.getElementById('pw-input').addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
  }

  function login() {
    var v = document.getElementById('pw-input').value.trim();
    if (!v) return;
    pw = v;
    localStorage.setItem('admin_pw', v);
    loadList();
  }

  function loadList() {
    el.innerHTML = '<p style="text-align:center;color:var(--muted);padding:60px">加载中…</p>';
    fetch('/api/admin/links?password=' + encodeURIComponent(pw))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) { pw=''; localStorage.removeItem('admin_pw'); renderLogin(d.error); return; }
        allLinks = d.links || [];
        renderList();
      })
      .catch(function(){ el.innerHTML = '<p class="error">网络错误，请刷新重试</p>'; });
  }

  function renderList() {
    var pending = allLinks.filter(function(l){ return l.status === 'pending'; });
    var approved = allLinks.filter(function(l){ return l.status === 'approved'; });

    var top = '<div class="topbar">' +
      '<h1>📋 友链管理</h1>' +
      '<button class="btn-logout" onclick="logout()">退出</button>' +
      '</div>';

    var tabs = '<div class="tabs">' +
      '<button class="tab' + (currentTab==='pending' ? ' active' : '') + '" onclick="switchTab(\'pending\')">待审核<span class="tab-count">' + pending.length + '</span></button>' +
      '<button class="tab' + (currentTab==='approved' ? ' active' : '') + '" onclick="switchTab(\'approved\')">已通过<span class="tab-count">' + approved.length + '</span></button>' +
      '<button class="tab' + (currentTab==='all' ? ' active' : '') + '" onclick="switchTab(\'all\')">全部<span class="tab-count">' + allLinks.length + '</span></button>' +
      '</div>';

    var list = currentTab === 'pending' ? pending : currentTab === 'approved' ? approved : allLinks;

    if (!list.length) {
      var emptyMsg = currentTab === 'pending' ? '✅ 暂无待审核的友链' :
                    currentTab === 'approved' ? '📭 还没有已通过的友链' : '📭 暂无友链';
      el.innerHTML = top + tabs + '<div class="empty-state"><p>' + emptyMsg + '</p></div>';
      return;
    }

    var html = top + tabs + '<div class="list">';
    list.forEach(function(l){
      var isPending = l.status === 'pending';
      html += '<div class="item ' + l.status + '">' +
        '<div class="item-body">' +
          '<p class="item-name">' + esc(l.name) +
            '<span class="badge ' + (isPending ? 'badge-pending' : 'badge-approved') + '">' + (isPending ? '待审核' : '已通过') + '</span>' +
          '</p>' +
          '<p class="item-url">' + esc(l.url) + '</p>' +
          (l.desc ? '<p class="item-desc">' + esc(l.desc) + '</p>' : '') +
          '<p class="item-time">' + fmtTime(l.created_at) + '</p>' +
        '</div>' +
        '<div class="item-actions">';
      if (isPending) {
        html += '<button class="btn btn-approve" data-id="' + l.id + '" onclick="approve(this)">✓ 通过</button>';
      } else {
        html += '<button class="btn btn-revoke" data-id="' + l.id + '" onclick="revoke(this)">↩ 撤回</button>';
      }
      html += '<button class="btn btn-delete" data-id="' + l.id + '" onclick="del(this)">✗ 删除</button>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  window.switchTab = function(tab) {
    currentTab = tab;
    renderList();
  };

  window.approve = function(btn){
    btn.disabled = true;
    var id = parseInt(btn.dataset.id);
    fetch('/api/admin/links', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw, action: 'approve', id: id })
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok) loadList();
        else alert(d.error || '失败');
      });
  };

  window.revoke = function(btn){
    btn.disabled = true;
    var id = parseInt(btn.dataset.id);
    fetch('/api/admin/links', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw, action: 'revoke', id: id })
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok) loadList();
        else alert(d.error || '失败');
      });
  };

  window.del = function(btn){
    if (!confirm('确定删除这条提交？此操作不可恢复。')) return;
    btn.disabled = true;
    var id = parseInt(btn.dataset.id);
    fetch('/api/admin/links', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw, action: 'delete', id: id })
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok) loadList();
        else alert(d.error || '失败');
      });
  };

  window.logout = function(){
    pw = '';
    localStorage.removeItem('admin_pw');
    renderLogin();
  };

  window.login = login;

  function esc(s) {
    return String(s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }

  // init
  if (pw) loadList(); else renderLogin();
})();
</script>
</body>
</html>
