<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RCJ 后台 · 统一面板</title>
  <style>
    :root {
      --bg: #f8fafc; --surface: #fff; --text: #0f172a; --muted: #64748b;
      --accent: #1e88e5; --danger: #dc2626; --line: #e2e8f0; --radius: 12px;
      --letout: #e07850; --solo: #6f9b8a; --facetalk: #7b8fc4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 820px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

    /* Topbar + tabs */
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .topbar h1 { margin: 0; }
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); }
    .tab {
      padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      border: none; background: none; color: var(--muted); border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: color .15s, border-color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Login (links) */
    .login-box {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 28px; max-width: 400px; margin: 60px auto;
    }
    .login-box label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .login-box input {
      width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid var(--line);
      border-radius: 8px; outline: none; transition: border-color .2s;
    }
    .login-box input:focus { border-color: var(--accent); }
    .login-box button {
      width: 100%; margin-top: 16px; padding: 11px; font-size: 15px; font-weight: 600;
      background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: background .2s;
    }
    .login-box button:hover { background: #1565c0; }

    .list { display: flex; flex-direction: column; gap: 12px; }
    .item {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 20px; display: flex; align-items: flex-start; gap: 16px; transition: box-shadow .15s;
    }
    .item:hover { box-shadow: 0 2px 8px rgba(15,23,42,.06); }
    .item.pending { border-left: 4px solid #f59e0b; }
    .item.approved { border-left: 4px solid #16a34a; }
    .item-body { flex: 1; min-width: 0; }
    .item-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .item-url { font-size: 13px; color: var(--accent); word-break: break-all; margin-bottom: 4px; }
    .item-desc { font-size: 13px; color: var(--muted); }
    .item-time { font-size: 12px; color: #94a3b8; margin-top: 6px; }
    .item-actions { display: flex; gap: 8px; flex-shrink: 0; padding-top: 2px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-approved { background: #dcfce7; color: #166534; }
    .btn { padding: 7px 16px; font-size: 13px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: background .15s; }
    .btn-approve { background: #dcfce7; color: #166534; }
    .btn-approve:hover { background: #bbf7d0; }
    .btn-delete { background: #fee2e2; color: #991b1b; }
    .btn-delete:hover { background: #fecaca; }
    .btn-revoke { background: #e0e7ff; color: #3730a3; }
    .btn-revoke:hover { background: #c7d2fe; }
    .btn:disabled { opacity: .5; cursor: default; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .topbar2 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .btn-logout { font-size: 13px; color: var(--muted); cursor: pointer; background: none; border: none; }
    .btn-logout:hover { color: var(--danger); }
    .error { background: #fef2f2; color: #991b1b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .tabs2 { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid var(--line); }
    .tab2 { padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; background: none; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab2:hover { color: var(--text); }
    .tab2.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-count { display: inline-block; min-width: 20px; text-align: center; font-size: 11px; background: var(--line); color: var(--muted); padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
    .tab2.active .tab-count { background: var(--accent); color: #fff; }

    /* Data dashboard */
    .data-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .data-note { font-size: 12px; color: var(--muted); background: #eef6ff; border: 1px solid #d6e8ff; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; line-height: 1.6; }
    .data-note a { color: var(--accent); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-num { font-size: 24px; font-weight: 800; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat.solo .stat-num { color: var(--solo); }
    .stat.letout .stat-num { color: var(--letout); }
    .stat.min .stat-num { color: var(--text); }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
    .card h3 { font-size: 15px; margin-bottom: 14px; }
    .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; }
    .bar-label { flex: 0 0 76px; color: var(--text); }
    .bar-track { flex: 1; background: #f1f5f9; border-radius: 999px; height: 16px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--letout); border-radius: 999px; transition: width .4s; }
    .bar-val { flex: 0 0 40px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

    .recent { display: flex; flex-direction: column; gap: 8px; }
    .r-item { display: flex; align-items: center; gap: 12px; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .r-item:last-child { border-bottom: none; }
    .r-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .r-dot.solo { background: var(--solo); }
    .r-dot.letout { background: var(--letout); }
    .r-main { flex: 1; min-width: 0; }
    .r-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-sub { color: var(--muted); font-size: 12px; }
    .r-time { color: var(--muted); font-size-12; font-size: 12px; flex-shrink: 0; }

    .btn-small { font-size: 13px; padding: 7px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px; cursor: pointer; }
    .btn-small:hover { background: #f1f5f9; }
    .muted { color: var(--muted); }
    .loading { text-align: center; color: var(--muted); padding: 50px; }
  </style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>RCJ 后台</h1>
    <div class="tabs">
      <button class="tab active" data-tab="links" onclick="switchTab('links')">友链审核</button>
      <button class="tab" data-tab="data" onclick="switchTab('data')">使用数据</button>
    </div>
  </div>

  <div class="panel" id="panel-links"><div id="app"></div></div>

  <div class="panel" id="panel-data" hidden>
    <div id="dataApp"></div>
  </div>
</div>

<script>
// ============ Tab 切换 ============
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.tab === tab); });
  document.getElementById('panel-links').hidden = (tab !== 'links');
  document.getElementById('panel-data').hidden = (tab !== 'data');
  if (tab === 'data') loadData();
}

// ============ 友链审核（D1） ============
(function(){
  var el = document.getElementById('app');
  var pw = localStorage.getItem('admin_pw') || '';
  var allLinks = [];
  var currentTab = 'pending';

  function renderLogin(err) {
    el.innerHTML = '<div class="login-box">' +
      '<h1>🔐 友链审核</h1>' +
      '<p class="sub">输入管理员密码</p>' +
      (err ? '<div class="error">' + esc(err) + '</div>' : '') +
      '<label>密码</label>' +
      '<input type="password" id="pw-input" placeholder="输入密码…" autofocus />' +
      '<button onclick="login()">登录</button>' +
      '</div>';
    document.getElementById('pw-input').addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
  }

  window.login = function() {
    var v = document.getElementById('pw-input').value.trim();
    if (!v) return;
    pw = v;
    localStorage.setItem('admin_pw', v);
    loadList();
  };

  function loadList() {
    el.innerHTML = '<p style="text-align:center;color:var(--muted);padding:60px">加载中…</p>';
    fetch('/api/admin/links?password=' + encodeURIComponent(pw))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) { pw=''; localStorage.removeItem('admin_pw'); renderLogin(d.error); return; }
        allLinks = d.links || [];
        renderList();
      })
      .catch(function(){ el.innerHTML = '<p class="error">网络错误，请刷新重试</p>'; });
  }

  function renderList() {
    var pending = allLinks.filter(function(l){ return l.status === 'pending'; });
    var approved = allLinks.filter(function(l){ return l.status === 'approved'; });

    var top = '<div class="topbar2">' +
      '<h1>📋 友链管理</h1>' +
      '<button class="btn-logout" onclick="logout()">退出</button>' +
      '</div>';

    var tabs = '<div class="tabs2">' +
      '<button class="tab2' + (currentTab==='pending' ? ' active' : '') + '" onclick="switchLinkTab(\'pending\')">待审核<span class="tab-count">' + pending.length + '</span></button>' +
      '<button class="tab2' + (currentTab==='approved' ? ' active' : '') + '" onclick="switchLinkTab(\'approved\')">已通过<span class="tab-count">' + approved.length + '</span></button>' +
      '<button class="tab2' + (currentTab==='all' ? ' active' : '') + '" onclick="switchLinkTab(\'all\')">全部<span class="tab-count">' + allLinks.length + '</span></button>' +
      '</div>';

    var list = currentTab === 'pending' ? pending : currentTab === 'approved' ? approved : allLinks;

    if (!list.length) {
      var emptyMsg = currentTab === 'pending' ? '✅ 暂无待审核的友链' :
                    currentTab === 'approved' ? '📭 还没有已通过的友链' : '📭 暂无友链';
      el.innerHTML = top + tabs + '<div class="empty-state"><p>' + emptyMsg + '</p></div>';
      return;
    }

    var html = top + tabs + '<div class="list">';
    list.forEach(function(l){
      var isPending = l.status === 'pending';
      html += '<div class="item ' + l.status + '">' +
        '<div class="item-body">' +
          '<p class="item-name">' + esc(l.name) +
            '<span class="badge ' + (isPending ? 'badge-pending' : 'badge-approved') + '">' + (isPending ? '待审核' : '已通过') + '</span>' +
          '</p>' +
          '<p class="item-url">' + esc(l.url) + '</p>' +
          (l.desc ? '<p class="item-desc">' + esc(l.desc) + '</p>' : '') +
          '<p class="item-time">' + fmtTime(l.created_at) + '</p>' +
        '</div>' +
        '<div class="item-actions">';
      if (isPending) {
        html += '<button class="btn btn-approve" data-id="' + l.id + '" onclick="approve(this)">✓ 通过</button>';
      } else {
        html += '<button class="btn btn-revoke" data-id="' + l.id + '" onclick="revoke(this)">↩ 撤回</button>';
      }
      html += '<button class="btn btn-delete" data-id="' + l.id + '" onclick="del(this)">✗ 删除</button>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  window.switchLinkTab = function(tab) { currentTab = tab; renderList(); };

  window.approve = function(btn){
    btn.disabled = true;
    var id = parseInt(btn.dataset.id);
    fetch('/api/admin/links', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, action: 'approve', id: id }) })
      .then(function(r){ return r.json(); }).then(function(d){ if (d.ok) loadList(); else alert(d.error || '失败'); });
  };
  window.revoke = function(btn){
    btn.disabled = true;
    var id = parseInt(btn.dataset.id);
    fetch('/api/admin/links', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, action: 'revoke', id: id }) })
      .then(function(r){ return r.json(); }).then(function(d){ if (d.ok) loadList(); else alert(d.error || '失败'); });
  };
  window.del = function(btn){
    if (!confirm('确定删除这条提交？此操作不可恢复。')) return;
    btn.disabled = true;
    var id = parseInt(btn.dataset.id);
    fetch('/api/admin/links', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, action: 'delete', id: id }) })
      .then(function(r){ return r.json(); }).then(function(d){ if (d.ok) loadList(); else alert(d.error || '失败'); });
  };
  window.logout = function(){ pw=''; localStorage.removeItem('admin_pw'); renderLogin(); };

  function esc(s) {
    return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }

  if (pw) loadList(); else renderLogin();
})();

// ============ 使用数据（本地 IndexedDB，Speak Series） ============
(function(){
  var dataEl = document.getElementById('dataApp');
  var MODE_LABEL = { say:'说出来', shout:'喊出来', sing:'唱出来', cry:'哭出来', quiet:'安静一下' };
  var dataLoaded = false;

  window.loadData = function() {
    dataEl.innerHTML = '<div class="loading">读取本机数据…</div>';
    Promise.all([ readAll('solospeak','recordings'), readAll('letout','releases') ])
      .then(function(res){
        renderData(res[0], res[1]);
      })
      .catch(function(){ dataEl.innerHTML = '<div class="empty-state"><p>读取失败。请确认你在 955827.xyz 下使用过 SoloSpeak / LetOut。</p></div>'; });
  };

  function readAll(dbName, store) {
    return new Promise(function(resolve){
      var req;
      try { req = indexedDB.open(dbName); } catch(e){ resolve([]); return; }
      req.onerror = function(){ resolve([]); };
      req.onsuccess = function(){
        var db = req.result;
        if (!db.objectStoreNames.contains(store)) { db.close(); resolve([]); return; }
        try {
          var tx = db.transaction(store, 'readonly');
          var os = tx.objectStore(store);
          var g = os.getAll();
          g.onsuccess = function(){ db.close(); resolve(g.result || []); };
          g.onerror = function(){ db.close(); resolve([]); };
        } catch(e){ db.close(); resolve([]); }
      };
    });
  }

  function renderData(solo, leto) {
    solo = solo || []; leto = leto || [];
    var soloMin = solo.reduce(function(a,r){ return a + (r.durationMs||0); },0) / 60000;
    var letoMin = leto.reduce(function(a,r){ return a + (r.durationMs||0); },0) / 60000;

    // LetOut 模式分布
    var modeCounts = {};
    leto.forEach(function(r){ var m = r.mode||'say'; modeCounts[m] = (modeCounts[m]||0)+1; });
    var modeRows = Object.keys(MODE_LABEL).map(function(m){
      var c = modeCounts[m]||0;
      var pct = leto.length ? Math.round(c / leto.length * 100) : 0;
      return '<div class="bar-row"><span class="bar-label">' + MODE_LABEL[m] + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="bar-val">' + c + '</span></div>';
    }).join('');
    if (!leto.length) modeRows = '<p class="muted">还没有任何释放记录。</p>';

    // 最近活动（合并）
    var recent = [];
    solo.forEach(function(r){ recent.push({ type:'solo', ts:r.createdAt, dur:r.durationMs, title: r.topicText || '独声练习', sub: 'SoloSpeak · 独声' }); });
    leto.forEach(function(r){ recent.push({ type:'letout', ts:r.createdAt, dur:r.durationMs, title: MODE_LABEL[r.mode]||r.mode, sub: 'LetOut · 大声说' }); });
    recent.sort(function(a,b){ return b.ts - a.ts; });
    recent = recent.slice(0, 12);
    var recentHtml = recent.length ? recent.map(function(r){
      return '<div class="r-item"><span class="r-dot ' + r.type + '"></span>' +
        '<div class="r-main"><div class="r-title">' + esc(r.title) + '</div>' +
        '<div class="r-sub">' + r.sub + ' · ' + Math.round(r.dur/1000) + 's</div></div>' +
        '<span class="r-time">' + fmtDate(r.ts) + '</span></div>';
    }).join('') : '<p class="muted">暂无活动。</p>';

    dataEl.innerHTML =
      '<div class="data-head"><h1>📊 Speak Series 使用数据</h1>' +
        '<button class="btn-small" onclick="exportSnapshot()">⬇ 导出数据快照</button></div>' +
      '<div class="data-note">数据来自你<strong>本机浏览器</strong>（本地优先，不上传服务器）。只有在 <code>955827.xyz</code> 下使用 SoloSpeak / LetOut 才会被统计；换浏览器或清缓存则归零。' +
        'FaceTalk 的数据在服务端（D1），请到 <a href="https://ms.955827.xyz/admin" target="_blank" rel="noopener">ms.955827.xyz/admin</a> 查看。</div>' +

      '<div class="stats">' +
        '<div class="stat solo"><div class="stat-num">' + solo.length + '</div><div class="stat-label">SoloSpeak 录音</div></div>' +
        '<div class="stat min"><div class="stat-num">' + soloMin.toFixed(0) + '</div><div class="stat-label">独声时长(分)</div></div>' +
        '<div class="stat letout"><div class="stat-num">' + leto.length + '</div><div class="stat-label">LetOut 释放</div></div>' +
        '<div class="stat min"><div class="stat-num">' + letoMin.toFixed(0) + '</div><div class="stat-label">释放时长(分)</div></div>' +
      '</div>' +

      '<div class="card"><h3>LetOut · 释放模式分布</h3>' + modeRows + '</div>' +
      '<div class="card"><h3>最近活动</h3><div class="recent">' + recentHtml + '</div></div>';

    window.__snapshot = {
      exportedAt: new Date().toISOString(),
      solospeak: { count: solo.length, minutes: +soloMin.toFixed(1) },
      letout: { count: leto.length, minutes: +letoMin.toFixed(1), modeCounts: modeCounts },
      recent: recent,
    };
  }

  window.exportSnapshot = function() {
    if (!window.__snapshot) return;
    var blob = new Blob([JSON.stringify(window.__snapshot, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'rcj-speak-data-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  };

  function esc(s) {
    return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
})();
</script>
</body>
</html>
