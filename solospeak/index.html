<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SoloSpeak · Solo Voice</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#6f7d5a" />
  <link rel="stylesheet" href="styles/app.css?v=20260901" />
</head>
<body>
  <div id="app">
        <header class="topbar">
      <div class="brand">SoloSpeak <span class="brand-sub" data-i18n="brandSub">Solo Voice</span></div>
      <nav class="nav">
        <button class="nav-btn active" data-route="home" data-i18n="navToday">Today</button>
        <select class="lang-select" id="langSelect" aria-label="Language">
          <option value="en">EN</option>
          <option value="zh">中</option>
          <option value="ja">日</option>
        </select>
        <button class="nav-gear" id="aiSettingsBtn" data-i18n-aria="navSettings" title="Settings" aria-label="Settings">⚙</button>
      </nav>
    </header>

    <main id="view" class="view"></main>

    <footer class="site-footer">
      <p class="mother-slogan" data-i18n="footerSlogan">Speaking itself is a kind of power.</p>
      <p class="foot-links">
                <a href="https://exam.955827.xyz/" target="_blank" rel="noopener">Exam Hub</a>
      </p>
    </footer>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="aiSettingsOverlay" class="ai-overlay">
    <div class="ai-panel">
      <div class="ai-panel-head" data-i18n="aiTitle">🤖 AI Guidance Settings</div>
      <div class="ai-panel-desc" data-i18n="aiDesc">Default uses RCJ built-in AI (free trial). For heavy use or more stability, enable custom below — your Key stays in your browser only.</div>
      <label class="ai-check"><input type="checkbox" id="aiEnabled"> <span data-i18n="aiEnable">Enable custom AI guidance (bring your own Key)</span></label>
      <div id="aiCustomConfig" hidden>
      <label class="ai-field"><span data-i18n="aiBaseUrl">API Base URL</span>
        <input type="text" id="aiBaseUrl" placeholder="https://api.siliconflow.cn/v1" autocomplete="off" spellcheck="false">
      </label>
      <label class="ai-field"><span data-i18n="aiKey">API Key</span>
        <input type="text" id="aiApiKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
        <button type="button" class="ai-key-toggle" id="aiApiKeyToggle" title="Show/hide API Key">👁</button>
      </label>
      <label class="ai-field"><span data-i18n="aiModel">Model name</span>
        <input type="text" id="aiModel" placeholder="deepseek-ai/DeepSeek-V3 · Qwen/Qwen3-... · ..." autocomplete="off" spellcheck="false">
      </label>
      <div class="ai-tut" data-i18n="aiTut">No Key? See <a href="https://exam.955827.xyz/guides/api-key.html" target="_blank" rel="noopener">RCJ · Free domestic LLM API guide</a></div>
      <div class="ai-test-row">
        <button class="mini-btn" id="aiTestBtn" data-i18n="aiTest">Test connection</button>
        <span class="ai-test-res" id="aiTestResult"></span>
      </div>
      </div>
      <div class="ai-sep"></div>
      <div class="ai-panel-head" data-i18n="aiMore">More</div>
      <button class="nav-btn ai-nav-btn" data-route="log" data-i18n="aiLog">📋 Voice Log</button>
      <button class="nav-btn ai-nav-btn" data-route="export" data-i18n="aiExport">📦 Export</button>
      <button class="nav-btn ai-nav-btn" data-route="about" data-i18n="aiAbout">ℹ️ About</button>
      <div class="ai-panel-actions">
        <button class="mini-btn" id="aiSettingsClose" data-i18n="aiCancel">Cancel</button>
        <button class="big-btn ai-save" id="aiSettingsSave" data-i18n="aiSave">Save</button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js?v=20260901"></script>
  <script src="js/ai-settings.js?v=20260901"></script>
  <script type="module" src="js/app.20260815.js?v=20260901"></script>
</body>
</html>
